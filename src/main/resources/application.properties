# Application Name
spring.application.name=hello-world-app

# Server Configuration
server.port=8080

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Active Profile (can be overridden by JVM argument or environment variable)
spring.profiles.active=@spring.profiles.active@

# Common Application Properties
app.environment=@activatedProperties@
app.greeting.message=Hello World
app.max.connections=100
app.feature.debug=false

# Logging Configuration
logging.level.root=INFO
logging.level.com.example.helloworld=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
